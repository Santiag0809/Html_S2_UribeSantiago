<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetroLinea🙌</title>
    <link rel="stylesheet" href="styles/styles.css">
    </link>
</head>

<body>
    <header>
        <div class="paisanada">
            <img src="img/logoMetro.png" alt="icono metro">
        </div>
        <div class="menu">
            <h2>Comprar Tarjeta</h2>
            <h2>Ver saldo</h2>
        </div>
        <div class="siPaisanada">
            <a href="https://www.metrolinea.gov.co/">
                <img src="img/carrito.png" alt="icono carrito">
            </a>
            <a href="">
                <img src="img/buscando.png" alt="icono busqueda">
            </a>
        </div>
    </header>
    <div class="menuPrin">
        <div class="contenidoPrincipal">
            <div class="tarjetin">
                <img src="img/metroooo.png" alt="tarjeta metro">
            </div>
            <div class="trueque">
                <h2>Tarjeta Metrolínea (Saldo $3000 COP)</h2>
                <p>$3000 COP</p>
            </div>
            <div class="botonTrueque">
                <img src="img/logoMetro.png" alt="botón de compra">
            </div>
        </div>
        <div class="lateral">
            <div class="flechaArriba">
                <img src="img/arriba.png" alt="Flecha arriba">
                <h3>Cantidad</h3>
            </div>

            <div class="contenidoCentral">
                
                <p>01 <br>02 <br>03</p>
            </div>

            <div class="flechaAbajo">
                <img src="img/abajo.png" alt="Flecha abajo">
            </div>
        </div>
</body>

</html>
